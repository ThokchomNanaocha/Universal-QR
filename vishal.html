<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Sheet From Upload</title>
  <style>
    @page {
      /* size: A4; */
      margin: 0;
    }

    body {
      margin: 0;
      /* padding-top:  30px; */
      box-sizing: border-box;
      font-family: sans-serif;
    }

    .page {
      width: 2in;
      height: 2in;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .row {
      display: flex;
      flex-direction: row;
      height: 2in;
      margin-bottom: 0.5in;
    }

    .cell {
      width: 2in;
      height: 2in;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gap {
      width: 0.3in;
      height: 2in;
    }

    #uploader {
      margin: 20px;
    }
      @media print {
        .onprint {
          display: none;
        }
    }
  </style>
</head>
<body>
  <input type="file" class="onprint" id="uploader" accept="image/*" multiple />
  <div class="page" id="page"></div>

  <script>
    const uploader = document.getElementById('uploader');
    const page = document.getElementById('page');
    const totalRows = 27;
    const qrPerRow = 2;

uploader.addEventListener('change', async (event) => {
  let files = Array.from(event.target.files);
  if (files.length === 0) return;

  // Sort files based on filename (numerical sort)
  files.sort((a, b) => {
    const aNum = parseInt(a.name.match(/\d+/)?.[0] || 0);
    const bNum = parseInt(b.name.match(/\d+/)?.[0] || 0);
    return aNum - bNum;
  });

  // Clear old content
  page.innerHTML = '';

  // Read all files into URLs
  const imageURLs = await Promise.all(
    files.map(file => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    }))
  );

  let imgIndex = 0;

  for (let row = 0; row < totalRows; row++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';

    for (let col = 0; col < qrPerRow; col++) {
      if (col > 0 && col % 1 === 0) {
        const gap = document.createElement('div');
        gap.className = 'gap';
        rowDiv.appendChild(gap);
      }

      const cell = document.createElement('div');
      cell.className = 'cell';

      const img = document.createElement('img');
      img.src = imageURLs[imgIndex] || ''; // use empty if out of images
      imgIndex++;

      cell.appendChild(img);
      rowDiv.appendChild(cell);
    }

    page.appendChild(rowDiv);
  }
});
  </script>
</body>
</html>
