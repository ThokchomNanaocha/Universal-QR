<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Sheet From Upload</title>
  <style>
    @page {
      size: A4;
      margin: 0;
    }

    body {
      margin: 0;
      padding-top: 60px;
      padding-bottom: 50px;
      padding-left: 30px;
      padding-right: 30px;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    .page {
      width: 8.27in;
      height: 11.69in;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .row {
      display: flex;
      flex-direction: row;
      height: 1in;
      margin-bottom: 0.4in;
    }

    .cell {
      width: 1in;
      height: 1in;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gap {
      width: 0.8in;
      height: 1in;
    }

    #uploader {
      margin: 20px;
    }
      @media print {
        .onprint {
          display: none;
        }
    }
  </style>
</head>
<body>
  <input type="file" class="onprint" id="uploader" accept="image/*" multiple />
  <div class="page" id="page"></div>

  <script>
    const uploader = document.getElementById('uploader');
    const page = document.getElementById('page');
    const totalRows = 11;
    const qrPerRow = 6;

    uploader.addEventListener('change', async (event) => {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      // Clear old content
      page.innerHTML = '';

      // Read all files into URLs
      const imageURLs = await Promise.all(
        files.map(file => new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        }))
      );

      let imgIndex = 0;

      for (let row = 0; row < totalRows; row++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';

        for (let col = 0; col < qrPerRow; col++) {
          if (col > 0 && col % 2 === 0) {
            const gap = document.createElement('div');
            gap.className = 'gap';
            rowDiv.appendChild(gap);
          }

          const cell = document.createElement('div');
          cell.className = 'cell';

          const img = document.createElement('img');
          img.src = imageURLs[imgIndex] || ''; // use empty if out of images
          imgIndex++;

          cell.appendChild(img);
          rowDiv.appendChild(cell);
        }

        page.appendChild(rowDiv);
      }
    });
  </script>
</body>
</html>
